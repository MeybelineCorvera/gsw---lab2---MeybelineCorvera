<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dulce Hogar - Repostería Artesanal</title>
<style>
:root{--bg:#fff6f3;--ink:#3b1f23;--berry:#b3202f;--soft:#f3d9d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px;display:grid;grid-template-columns:1fr;gap:28px;align-items:center}
@media(min-width:720px){.wrap{grid-template-columns:1fr 320px;padding-top:64px}}
h1{font-size:2.4rem;line-height:1.1;margin:0 0 12px;color:var(--berry)}
p{margin:0 0 14px;max-width:46ch}
.btn{display:inline-block;background:var(--berry);color:var(--bg);padding:10px 18px;border-radius:999px;text-decoration:none}
.foto{width:100%;max-width:320px;border-radius:18px;display:block;justify-self:center;box-shadow:0 10px 30px rgba(0,0,0,.18)}
footer{border-top:1px solid var(--soft);padding:16px 20px;text-align:center;font-size:.95rem}
</style>
</head>
<body>
<main class="wrap">
<section>
<h1>Dulce Hogar</h1>
<p>Repostería artesanal salvadoreña. Pasteles y postres hechos a mano, con ingredientes frescos.</p>
<p>Pronto podrás ver el catálogo y reservar tu pedido aquí.</p>
<a class="btn" href="#">Reservar pedido</a>
</section>
<img class="foto" src="img/torta.jpg" alt="Rollo de vainilla con crema y fresas">
</main>
<footer>Administrador del servidor: MEYBELINE CORVERA</footer>
</body>
</html>
